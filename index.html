<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tromsø social dance calendar</title>
<style>
:root{--bg:#e9f0f4;--surface:#fff;--ink:#11263a;--muted:#546a7c;--line:#cfdbe3;--accent:#0b7a6b;--on-accent:#fff;--bad:#c4262e;--bad-bg:#fde8e9}
@media (prefers-color-scheme:dark){:root{--bg:#0c1824;--surface:#132536;--ink:#e8f3f7;--muted:#9bb2c1;--line:#25405a;--accent:#4fd1b5;--on-accent:#0c1824;--bad:#ff8d93;--bad-bg:#3d1d2a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{margin:0;letter-spacing:-.01em;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:1200px;margin:0 auto;padding:16px;display:grid;grid-template-columns:260px 1fr;gap:16px}
@media(max-width:860px){.app{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
h1{font-size:26px;margin-bottom:6px}
.sub{color:var(--muted);margin:0 0 16px}
.row1{display:flex;gap:6px;margin-bottom:6px;position:relative}
.row1:has(.site) .club{padding-right:34px}
.club{flex:1;display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:transparent;text-align:left}
.club .sw{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}
.club[aria-pressed="false"]{opacity:.5}
.club[aria-pressed="false"] .sw{background:transparent;border:2px solid var(--c)}
.site{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--muted);opacity:.55;text-decoration:none;font-size:13px}
.site:hover,.site:focus-visible{color:var(--accent);opacity:1}
.foot{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 0 12px;text-align:center}
.foot a.coffee{text-decoration:none;background:#ffdd00;border-color:#ffdd00;color:#11263a}
.btn{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.stack{display:grid;gap:8px;margin-top:12px}
.stack a{color:var(--accent);font-weight:700}
.muted{color:var(--muted);font-size:13px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bar h2{font-size:24px;flex:1;min-width:150px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-weight:700;color:var(--muted);font-size:12px;padding:2px 4px}
.cell{min-height:92px;border:1px solid var(--line);border-radius:10px;padding:4px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cell.out{opacity:.45}
.cell.sel{outline:3px solid var(--accent);outline-offset:-1px}
.cell .n{font-weight:700;font-size:13px;padding:0 3px}
.cell.today .n{background:var(--accent);color:var(--on-accent);border-radius:999px;display:inline-block;width:24px;text-align:center;padding:0}
.chip{font-size:11px;line-height:1.2;padding:2px 4px;border-radius:5px;border:1.5px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.going{background:var(--c);color:#fff;font-weight:700}
.chip.clash{border-style:dashed}
.more{font-size:11px;color:var(--muted);padding-left:3px}
@media(max-width:640px){.cell{min-height:58px}.chip{font-size:0;height:8px;padding:0;border-radius:4px}}
.agenda h3{font-size:20px;margin-bottom:10px}
.ev{border-left:6px solid var(--c);background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.ev .info{flex:1;min-width:200px}
.ev b{font-size:16px}
.meta{color:var(--muted)}
.desc{margin:6px 0 0}
.ev a{color:var(--accent);font-weight:700}
.warn{display:inline-block;margin-top:4px;background:var(--bad-bg);color:var(--bad);border-radius:6px;padding:2px 8px;font-size:13px;font-weight:700}
.go[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.empty{color:var(--muted)}
.orgs .muted{margin-bottom:6px}
.types{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.types .muted{width:100%}
.tag{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px}
.tag[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.badge{display:inline-block;margin-left:6px;padding:0 8px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted)}
.badge.dance{border-color:var(--accent);color:var(--accent)}
.upcoming h3{font-size:20px;margin-bottom:10px}
.up{display:grid;grid-template-columns:200px 1fr auto;gap:4px 12px;align-items:center;width:100%;text-align:left;border:0;border-left:6px solid var(--c);background:var(--bg);border-radius:10px;padding:8px 12px;margin-bottom:6px}
.up .when{font-weight:700}
.up .what b{font-size:15px}
.up .going-tag{font-size:12px;font-weight:700;color:var(--accent)}
@media(max-width:640px){.up{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <h1 id="h1">Tromsø social dance calendar</h1>
    <p class="sub">Every organizer’s socials in one place. Mark what you’re going to.</p>
    <div class="orgs">
      <div class="muted">Organizer</div>
      <div id="clubs"></div>
    </div>
    <div id="types" class="types"></div>
    <div class="stack">
      <a id="contact" hidden>Send a correction</a>
    </div>
  </aside>
  <main class="panel">
    <div class="bar">
      <h2 id="title"></h2>
      <button class="btn" id="prev" aria-label="Previous month">‹</button>
      <button class="btn" id="today">Today</button>
      <button class="btn" id="next" aria-label="Next month">›</button>
    </div>
    <div class="grid" id="dows"></div>
    <div class="grid" id="cal"></div>
    <section class="agenda" style="margin-top:18px" aria-live="polite">
      <h3 id="dayTitle"></h3>
      <div id="agenda"></div>
    </section>
  </main>
  <section class="panel upcoming" style="grid-column:1/-1">
    <h3>All upcoming socials</h3>
    <div id="upcoming"></div>
  </section>
  <footer class="foot" style="grid-column:1/-1">
    <a id="coffee" class="btn coffee" hidden target="_blank" rel="noopener noreferrer">☕ Buy me a coffee</a>
    <small class="muted" id="coffeeNote" hidden>Helps cover the domain and the time spent keeping this up to date.</small>
  </footer>
</div>
<script src="data.js"></script>
<script>
const D=window.CALENDAR||{title:'Calendar',clubs:[],weekly:[],events:[]};
const CLUBS=D.clubs||[];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const mins=t=>{const[a,b]=t.split(':').map(Number);return a*60+b};
const span=e=>{const s=mins(e.s);let en=mins(e.e);if(en<=s)en+=1440;return[s,en]};
const safeUrl=u=>{try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:''}catch(e){return ''}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const club=id=>CLUBS.find(c=>c.id===id)||{id,name:id,color:'#888'};
const TODAY=new Date();TODAY.setHours(0,0,0,0);
let view=new Date(TODAY.getFullYear(),TODAY.getMonth(),1),sel=key(TODAY);
let S={off:[],going:[],offTypes:[],offDances:[]};
try{const r=localStorage.getItem('tromso-dance');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('tromso-dance',JSON.stringify(S))}catch(e){}};

const SB=D.supabase&&safeUrl(D.supabase.url||'')&&D.supabase.anonKey?{url:safeUrl(D.supabase.url).replace(/\/$/,''),key:D.supabase.anonKey}:null;
let COUNTS={};
let CID='';
try{CID=localStorage.getItem('tromso-dance-cid')||'';if(!CID){CID=crypto.randomUUID();localStorage.setItem('tromso-dance-cid',CID)}}catch(e){}
const sbFetch=(path,opt)=>fetch(SB.url+'/rest/v1/'+path,Object.assign({headers:{apikey:SB.key,Authorization:'Bearer '+SB.key,'Content-Type':'application/json'}},opt));
async function loadCounts(){
  if(!SB)return;
  try{const r=await sbFetch('going_counts?select=event_id,n');if(!r.ok)return;
    COUNTS={};(await r.json()).forEach(x=>COUNTS[x.event_id]=x.n);renderCal();renderAgenda();renderUpcoming()}catch(e){}
}
let queue=Promise.resolve();
function pushGoing(id,going){
  if(!SB||!CID)return;
  queue=queue.then(async()=>{
    try{await sbFetch('rpc/set_going',{method:'POST',body:JSON.stringify({p_event:id,p_client:CID,p_going:going})})}catch(e){}
    await loadCounts();
  });
}

document.title=D.title||document.title;$('h1').textContent=D.title||'';
if(safeUrl(D.contact||'')||/^mailto:/.test(D.contact||'')){$('contact').href=D.contact;$('contact').textContent='Send a correction';$('contact').hidden=false}

const coffeeUrl=safeUrl(D.coffee||'');
if(coffeeUrl){$('coffee').href=coffeeUrl;$('coffee').hidden=false;$('coffeeNote').hidden=false}
const mk=(o,k)=>{
  const first=o.date||k,last=o.endDate||first,multi=last>first;
  const s=!multi||k===first?o.start:'00:00',e=!multi||k===last?o.end:'24:00';
  return{id:o.club+'|'+o.title+'|'+first,club:o.club,t:o.title,d:k,s:multi&&k===first&&!o.start?'00:00':s,e:multi&&k===last&&!o.end?'24:00':e,v:o.venue,x:o.desc,u:o.url,nt:!o.start,type:o.type||'Social',dances:o.dances||[],first,last,multi};
};
function eventsOn(k){
  const d=new Date(k+'T00:00'),out=[];
  (D.weekly||[]).forEach(w=>{
    if(d.getDay()!==w.weekday||(w.from&&k<w.from)||(w.until&&k>w.until))return;
    if(w.every>1){const days=Math.round((d-new Date((w.from||'2000-01-03')+'T00:00'))/864e5);if(Math.floor(days/7)%w.every)return}
    out.push(mk(w,k));
  });
  (D.events||[]).forEach(e=>{if(k>=e.date&&k<=(e.endDate||e.date))out.push(mk(e,k))});
  return out;
}
const TYPES=(D.types||['Social','Event']).concat([...new Set([...(D.weekly||[]),...(D.events||[])].map(o=>o.type||'Social'))]).filter((t,i,a)=>a.indexOf(t)===i);
const DANCES=(D.dances||['Bachata','Salsa','Zouk','Kizomba','WCS']).concat([...new Set([...(D.weekly||[]),...(D.events||[])].flatMap(o=>o.dances||[]))]).filter((t,i,a)=>a.indexOf(t)===i);
const danceOk=e=>!e.dances.length||e.dances.some(x=>!S.offDances.includes(x));
const byDay=k=>eventsOn(k).filter(e=>!S.off.includes(e.club)&&!S.offTypes.includes(e.type)&&danceOk(e)).sort((a,b)=>mins(a.s)-mins(b.s));
function clashes(e){
  const[s1,e1]=span(e);
  return byDay(e.d).filter(o=>o.id!==e.id&&S.going.includes(o.id)&&(()=>{const[s2,e2]=span(o);return s1<e2&&s2<e1})());
}
function renderTypes(){
  const box=$('types');box.innerHTML='';
  const groups=[['Type',TYPES,'offTypes'],['Dance',DANCES,'offDances']];
  groups.forEach(([label,list,k])=>{
    if(list.length<2)return;
    const h=document.createElement('div');h.className='muted';h.textContent=label;box.appendChild(h);
    list.forEach(t=>{
      const b=document.createElement('button');b.className='tag';
      b.setAttribute('aria-pressed',!S[k].includes(t));b.textContent=t;
      b.onclick=()=>{S[k]=S[k].includes(t)?S[k].filter(x=>x!==t):S[k].concat(t);save();render()};
      box.appendChild(b);
    });
  });
}
function renderClubs(){
  const box=$('clubs');box.innerHTML='';
  CLUBS.forEach(c=>{
    const row=document.createElement('div');row.className='row1';
    const b=document.createElement('button');b.className='club';b.style.setProperty('--c',c.color);
    b.setAttribute('aria-pressed',!S.off.includes(c.id));
    b.innerHTML='<span class="sw"></span><b>'+esc(c.name)+'</b>';
    b.onclick=()=>{S.off=S.off.includes(c.id)?S.off.filter(x=>x!==c.id):S.off.concat(c.id);save();render()};
    row.appendChild(b);
    const u=safeUrl(c.url||'');
    if(u){const a=document.createElement('a');a.className='site';a.href=u;a.target='_blank';a.rel='noopener noreferrer';a.textContent='↗';a.title='Website';a.setAttribute('aria-label',c.name+' website');row.appendChild(a)}
    box.appendChild(row);
  });
}
function renderCal(){
  $('title').textContent=view.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const start=new Date(view);start.setDate(1-((view.getDay()+6)%7));
  const g=$('cal');g.innerHTML='';
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    const k=key(d),evs=byDay(k);
    const b=document.createElement('button');
    b.className='cell'+(d.getMonth()!==view.getMonth()?' out':'')+(k===sel?' sel':'')+(k===key(TODAY)?' today':'');
    b.setAttribute('aria-label',d.toDateString()+', '+evs.length+' socials');
    let h='<span class="n">'+d.getDate()+'</span>';
    evs.slice(0,3).forEach(e=>{const gg=S.going.includes(e.id),cl=!gg&&clashes(e).length;
      h+='<span class="chip'+(gg?' going':'')+(cl?' clash':'')+'" style="--c:'+club(e.club).color+'">'+esc((e.nt?'':e.s+' ')+e.t)+'</span>'});
    if(evs.length>3)h+='<span class="more">+'+(evs.length-3)+' more</span>';
    b.innerHTML=h;b.onclick=()=>{sel=k;render()};g.appendChild(b);
  }
}
function renderAgenda(){
  $('dayTitle').textContent=new Date(sel+'T00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
  const A=$('agenda'),evs=byDay(sel);A.innerHTML='';
  if(!evs.length){A.innerHTML='<p class="empty">No socials this day. Pick another day, or turn on more organizers.</p>';return}
  evs.forEach(e=>{
    const c=club(e.club),g=S.going.includes(e.id),cl=clashes(e);
    const el=document.createElement('div');el.className='ev';el.style.setProperty('--c',c.color);
    el.innerHTML='<div class="info"><b></b><div class="meta"></div></div>';
    const info=el.querySelector('.info');
    el.querySelector('b').textContent=e.t+' · '+c.name;
    const n=COUNTS[e.id]||0;
    el.querySelector('.meta').textContent=(e.multi?fmtRange(e)+' · day '+(Math.round((new Date(e.d)-new Date(e.first))/864e5)+1)+' of '+(Math.round((new Date(e.last)-new Date(e.first))/864e5)+1):e.nt?'':e.s+'–'+e.e)+(e.v&&(e.multi||!e.nt)?' · ':'')+(e.v||'')+(SB?' · '+n+' going':'');
    if(e.type!=='Social'){const bd=document.createElement('span');bd.className='badge';bd.textContent=e.type;el.querySelector('b').after(bd)}
    e.dances.slice().reverse().forEach(x=>{const bd=document.createElement('span');bd.className='badge dance';bd.textContent=x;el.querySelector('b').after(bd)});
    const ds=e.x||c.desc||'',us=safeUrl(e.u||c.url||'');
    if(ds){const p=document.createElement('p');p.className='desc';p.textContent=ds;info.appendChild(p)}
    if(us){const a=document.createElement('a');a.href=us;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Event page';info.appendChild(a)}
    if(cl.length){const w=document.createElement('div');w.className='warn';w.textContent='Clashes with '+cl.map(o=>o.t+' ('+club(o.club).name+')').join(', ');info.appendChild(w)}
    const bt=document.createElement('button');bt.className='btn go';bt.setAttribute('aria-pressed',g);bt.textContent=g?'Going ✓':'Mark as going';
    bt.onclick=()=>{S.going=g?S.going.filter(x=>x!==e.id):S.going.concat(e.id);save();render();pushGoing(e.id,!g)};
    el.appendChild(bt);A.appendChild(el);
  });
}
const fmtDay=k=>new Date(k+'T00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const fmtRange=e=>fmtDay(e.first)+' – '+fmtDay(e.last);
function renderUpcoming(){
  const box=$('upcoming');box.innerHTML='';
  let any=false;
  for(let i=0;i<180;i++){
    const d=new Date(TODAY);d.setDate(d.getDate()+i);const k=key(d);
    byDay(k).forEach(e=>{
      if(e.multi&&i>0&&k!==e.first)return;
      any=true;
      const c=club(e.club),g=S.going.includes(e.id);
      const b=document.createElement('button');b.className='up';b.style.setProperty('--c',c.color);
      const w=document.createElement('div');w.className='when';
      w.textContent=e.multi?fmtRange(e):fmtDay(k)+(e.nt?'':' · '+e.s+'–'+e.e);
      const t=document.createElement('div');t.className='what';
      const n=document.createElement('b');n.textContent=e.t;
      const m=document.createElement('span');m.className='meta';
      m.textContent=' · '+c.name+(e.v?' · '+e.v:'')+(SB?' · '+(COUNTS[e.id]||0)+' going':'');
      t.append(n);
      if(e.type!=='Social'){const bd=document.createElement('span');bd.className='badge';bd.textContent=e.type;t.append(bd)}
      e.dances.forEach(x=>{const bd=document.createElement('span');bd.className='badge dance';bd.textContent=x;t.append(bd)});
      t.append(m);b.append(w,t);
      if(g){const x=document.createElement('span');x.className='going-tag';x.textContent='Going ✓';b.appendChild(x)}
      b.onclick=()=>{sel=k;view=new Date(d.getFullYear(),d.getMonth(),1);render();$('title').scrollIntoView({behavior:'smooth',block:'start'})};
      box.appendChild(b);
    });
  }
  if(!any)box.innerHTML='<p class="empty">No upcoming socials. Turn on more organizers.</p>';
}
function render(){renderClubs();renderTypes();renderCal();renderAgenda();renderUpcoming()}

$('dows').innerHTML=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>'<div class="dow">'+x+'</div>').join('');
$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);renderCal()};
$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);renderCal()};
$('today').onclick=()=>{view=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);sel=key(TODAY);render()};
render();
loadCounts();
</script>
</body>
</html>
